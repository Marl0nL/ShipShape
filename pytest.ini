[pytest]
# Shared tests live in tests/; each track keeps its own tests in its directory.
testpaths = tests ship/tests fleetledger/tests
pythonpath = fleetledger tests/plugins
# leftover_daemons: stop the gpg-agents tests start (tests/plugins/leftover_daemons.py).
addopts = -ra -p leftover_daemons
# Keep only failed tests' temp folders, and only the last run's.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
