[pytest]
# Shared tests live in tests/; each track keeps its own tests in its directory.
testpaths = tests ship/tests fleetledger/tests
pythonpath = fleetledger tests/plugins
# leftover_daemons: stop the gpg-agents tests start (tests/plugins/leftover_daemons.py).
addopts = -ra -p leftover_daemons
# Keep only failed tests' temp folders, and only the last run's.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
# classic_herdr: tests that exist only for classic herdr Ships (ship.toml runtime =
# "herdr") and the move off it. scripts/check leaves them out unless
# SHIPSHAPE_TEST_CLASSIC_HERDR=1, which CI sets; they are deleted with classic herdr.
markers =
    classic_herdr: exists only for classic herdr; deleted with it (scripts/check: SHIPSHAPE_TEST_CLASSIC_HERDR)
