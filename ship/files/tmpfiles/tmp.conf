# ShipShape: /tmp is a folder on the root disk (ship-provision masks tmp.mount).
# systemd-tmpfiles keeps it 1777 at every boot and its daily clean-up removes
# what nothing has used for 10 days, so it cannot grow without end. The same
# lines as systemd's own tmp.conf, which this file replaces.
q /tmp 1777 root root 10d
q /var/tmp 1777 root root 30d
