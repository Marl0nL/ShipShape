# ShipShape: keys only, no root, two users, the pinned host key only.
# Sorts before cloud-init's drop-in, and sshd keeps the first value it reads.
HostKey /etc/ssh/ssh_host_ed25519_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers fleet agent
AllowAgentForwarding no
