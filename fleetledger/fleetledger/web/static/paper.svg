<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Aged paper: fine fibres and a little mottling, very faint. -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.6" numOctaves="2" seed="3" stitchTiles="stitch" result="fine"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" stitchTiles="stitch" result="mottle"/>
    <feComposite in="fine" in2="mottle" operator="arithmetic" k2="0.55" k3="0.45"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0 0.12  0 0 0 0.5 -0.22"/>
  </filter>
  <rect width="300" height="300" filter="url(#p)"/>
</svg>
