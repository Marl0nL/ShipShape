# gcloud user sign-in plus Application Default Credentials in one flow.
#
# Every gcloud command runs with file logging off: gcloud's own debug log
# (~/.config/gcloud/logs) records the sign-in code during `auth login`, and
# the other commands handle tokens (phase 0 spike S5).
id = "gcloud"
label = "gcloud and ADC"
mode = "paste-back"
run = "CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth login --no-launch-browser --update-adc"
timeout = 600

[match]
url = 'https://accounts\.google\.com/o/oauth2/\S+'
prompt = '(?i)enter (?:the )?(?:verification|authorization) code'
success = 'You are now logged in as \['
failure = '(?i)(?:invalid_grant|ERROR: \(gcloud\.auth)'

[[check]]
service = "gcloud"
run = "CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth list --filter=status:ACTIVE --format='value(account)'"
account = "stdout"

[[check]]
service = "gcloud_adc"
# The token goes to /dev/null on the Ship; only the exit code comes back.
run = "CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth application-default print-access-token >/dev/null"

[logout]
run = "CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth application-default revoke --quiet; CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth revoke --all --quiet"
