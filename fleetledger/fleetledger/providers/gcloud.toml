# gcloud user sign-in plus Application Default Credentials in one flow.
id = "gcloud"
label = "gcloud and ADC"
mode = "paste-back"
run = "gcloud auth login --no-launch-browser --update-adc"
timeout = 600

[match]
url = 'https://accounts\.google\.com/o/oauth2/\S+'
prompt = '(?i)enter (?:the )?(?:verification|authorization) code'
success = 'You are now logged in as \['
failure = '(?i)(?:invalid_grant|ERROR: \(gcloud\.auth)'

[[check]]
service = "gcloud"
run = "gcloud auth list --filter=status:ACTIVE --format='value(account)'"
account = "stdout"

[[check]]
service = "gcloud_adc"
# The token goes to /dev/null on the Ship; only the exit code comes back.
run = "gcloud auth application-default print-access-token >/dev/null"

[logout]
run = "gcloud auth application-default revoke --quiet; gcloud auth revoke --all --quiet"
