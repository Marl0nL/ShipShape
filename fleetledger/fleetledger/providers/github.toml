# GitHub device flow: gh shows a one-time code; you type it at
# github.com/login/device and gh finishes on its own.
#
# GH_PROMPT_DISABLED=1 is required: gh's interactive prompts query the
# terminal for its cursor position (CSI 6n) and wait for an answer that only
# a real terminal emulator gives. With prompts off, gh prints the code and the
# link and goes straight to polling (as recorded in phase 0 spike S5).
id = "github"
label = "GitHub"
mode = "device-code"
run = "GH_PROMPT_DISABLED=1 gh auth login --hostname github.com --git-protocol https --web"
timeout = 900
after = ["gh auth setup-git --hostname github.com"]

[signin]
label = "GitHub"
order = 3

[match]
url = 'https://github\.com/login/device'
code = 'one-time code: ([A-Z0-9]{4}-[A-Z0-9]{4})'
success = '(?:Authentication complete|Logged in as)'
failure = '(?i)(?:failed to authenticate|authentication failed|expired_token)'

[[check]]
service = "github"
run = "gh api user --jq .login"
account = "stdout"

[logout]
run = "gh auth logout --hostname github.com"

# Extra scopes the Ship chose (fleetledger/ghscopes.py): login asks for them with
# --scopes; on a Ship already signed in, gh auth refresh adds and drops them in the
# same device flow (and refuses an approval by a different account).
[scopes]
add = "--scopes"
refresh = "GH_PROMPT_DISABLED=1 gh auth refresh --hostname github.com"
remove = "--remove-scopes"
