# Application Default Credentials only (for example to add scopes later).
#
# Every gcloud command runs with file logging off: gcloud's own debug log
# (~/.config/gcloud/logs) records the sign-in code during `auth login`, and
# the other commands handle tokens (phase 0 spike S5).
id = "gcloud-adc"
label = "Google ADC"
mode = "paste-back"
run = "CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth application-default login --no-launch-browser"
timeout = 600

# Signs in only the ADC part of gcloud; no sign-in of its own.
[signin]
part_of = "gcloud"

[match]
url = 'https://accounts\.google\.com/o/oauth2/\S+'
prompt = '(?i)enter (?:the )?(?:verification|authorization) code'
success = 'Credentials saved to file'
failure = '(?i)(?:invalid_grant|ERROR: \(gcloud\.auth)'

[[check]]
service = "gcloud_adc"
run = "CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth application-default print-access-token >/dev/null"

[logout]
run = "CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1 gcloud auth application-default revoke --quiet"
