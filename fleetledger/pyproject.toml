[project]
name = "fleetledger"
version = "0.1.0"
description = "FleetLedger: find, show and manage ShipShape Ships (the ship-fleet command)."
readme = "README.md"
requires-python = ">=3.12"
# Keep in step with the pins in the repo's requirements-dev.txt, which CI tests with.
dependencies = [
  "jsonschema>=4.26,<5",
  "pexpect>=4.9,<5",
  "pycdlib>=1.22,<2",
  "PyYAML>=6.0.3,<7",
  "tomlkit>=0.15.2,<1",
  "zeroconf>=0.153,<1",
]

[project.scripts]
ship-fleet = "fleetledger.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetledger*"]

[tool.setuptools.package-data]
fleetledger = ["providers/*.toml"]
