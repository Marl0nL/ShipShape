[project]
name = "fleetledger"
version = "0.1.0"
description = "FleetLedger: find, show and manage ShipShape Ships (the ship-fleet command)."
readme = "README.md"
requires-python = ">=3.12"
# Keep in step with the pins in the repo's requirements-dev.txt, which CI tests with.
dependencies = [
  "Jinja2>=3.1.6,<4",
  "jsonschema>=4.26,<5",
  "keyring>=25.7,<26",
  "pexpect>=4.9,<5",
  "pycdlib>=1.22,<2",
  "PyYAML>=6.0.3,<7",
  "starlette>=1.10,<2",
  "tomlkit>=0.15.2,<1",
  "uvicorn>=0.54,<1",
  "websockets>=17.4,<18",
  "zeroconf>=0.153,<1",
]

[project.scripts]
ship-fleet = "fleetledger.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetledger*"]

[tool.setuptools.package-data]
fleetledger = ["providers/*.toml", "web/templates/*.html", "web/static/*"]
