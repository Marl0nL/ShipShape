name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    # Run serially, the suite took 15-25 minutes on a hosted runner (median about
    # 20); it now runs in 4 workers. 40 is a stopgap so a passing run is never
    # cancelled: lower it again once the planned test speedups have landed and
    # their run times are measured.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commit messages are scanned by the hygiene check

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install tools
        run: |
          python -m pip install -r requirements-dev.txt
          command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: scripts/check
        env:
          PYTHON: python
          SHIPSHAPE_TEST_WORKERS: "4"
          SHIPSHAPE_HYGIENE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/check
