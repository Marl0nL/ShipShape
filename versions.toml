# Pinned versions shared by the Ship and Fleet tracks.
# Schema: contracts/versions.schema.json. Change it in its own PR; both tracks read it.
#
# Ship side: ship-provision installs exactly these (checksums and signing keys verified).
# Fleet side: the seed generator picks the base image from [ubuntu]; ship-fleet compares
# a Ship's reported tooling version with [shipshape].tooling.
schema = 1

[shipshape]
tooling = "0.1.0"

[ubuntu]
release = "26.04"
build = "20261016"
# The codename path: releases/26.04/... only redirects here (curl needs -L for it).
base_url = "https://cloud-images.ubuntu.com/releases/resolute/release-20261016"
# UEC Image Automatic Signing Key; signs SHA256SUMS (SHA256SUMS.gpg) in base_url.
# Check with gpgv against this key alone, no keyserver or dirmngr needed:
#   gpgv --keyring ./ubuntu-cloud.gpg SHA256SUMS.gpg SHA256SUMS
# (ubuntu-cloud.gpg: the key, dearmored, with this primary fingerprint), then
# sha256sum against both SHA256SUMS and the sha256 pinned below.
signing_key = "D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81"

[ubuntu.images.amd64]
file = "ubuntu-26.04-server-cloudimg-amd64.img"
sha256 = "5645d0318ad21f643ebb1ac4567514620e9893380b07b0201fda163baa5b7eb5"

[ubuntu.images.arm64]
file = "ubuntu-26.04-server-cloudimg-arm64.img"
sha256 = "8eb876c2ccc4b6ff89e4a65d511815923b285e04503ba465809bf587f763da24"

[herdr]
version = "0.9.5"

[herdr.assets.x86_64]
url = "https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64"
sha256 = "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d"

[herdr.assets.aarch64]
url = "https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-aarch64"
sha256 = "17d7536f2da50859523680ef279dffcac8e4a235f4e46fe8da6c2ec44141897c"

[claude]
# Native installer as the agent user; it then updates itself on the Ship's channel.
install = "native"
default_channel = "latest"
# From this version, auto is the built-in starting permission mode on every plan
# and provider (2.1.283 did so only on third-party providers or with telemetry off).
minimum_version = "2.1.284"
# Anthropic Claude Code release signing key; signs each release's manifest.json.
release_key = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
manifest_base = "https://downloads.claude.ai/claude-code-releases"

