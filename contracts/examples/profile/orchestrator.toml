# A profile: a set of recipes plus a setup script that needs one local value.
schema = 1
id = "orchestrator"
description = "An orchestrator repo and the tools it needs"
tools = ["example-cli", "example-skill"]
setup = "orchestrator/setup.sh"

[options.repo_url]
description = "Git URL of the orchestrator repo (set locally, never committed)"
required = true
pattern = "^https://"
