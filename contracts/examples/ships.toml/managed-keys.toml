# Keys FleetLedger made and protects itself: random passphrases in the OS keyring.
schema = 1

[fleet]
admin_key = "~/.ssh/shipshape_fleet_ed25519"
agent_keys = ["~/.ssh/shipshape_ed25519.pub"]

[fleet.managed_keys]
store = "keyring"
keys = ["~/.ssh/shipshape_fleet_ed25519", "~/.ssh/shipshape_ed25519"]
