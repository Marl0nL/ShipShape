# Your own toolkits (contracts/toolkit.md): folders of yours, read by FleetLedger.
schema = 1

[fleet]
admin_key = "~/.ssh/shipshape_fleet_ed25519"
agent_keys = ["~/.ssh/id_ed25519.pub"]

[defaults]
tools = ["gh-axi", "examplekit/example-cli"]
profiles = ["examplekit/dev"]

[toolkit.examplekit]
path = "~/toolkits/examplekit"
only_tags = ["work"]
allow_root = false

[toolkit.examplekit.options]
site = "docs.example.com"

[profile_options."examplekit/dev"]
workspace = "https://example.com/workspace.git"

[ship.ship-01]
id = "7c9e6679-7425-40de-944b-e07fc1f90ae7"
tags = ["work"]
driver = "manual"
names = ["ship-01.local"]
host_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGV4YW1wbGVob3N0a2V5ZXhhbXBsZWhvc3RrZXlleGFt ship-01"
tools = ["examplekit/example-cli"]
