# Keys for a Headscale server are pasted; the Tailscale API cannot mint them.
schema = 1

[fleet]
admin_key = "~/.ssh/shipshape_fleet_ed25519"
agent_keys = ["~/.ssh/id_ed25519.pub"]

[overlay]
provider = "headscale"
login_server = "https://headscale.example.com"
key_source = "tailscale-api"

[overlay.api]
oauth_client_id = "kExampleClient1"
oauth_secret_file = "~/.config/fleetledger/tailscale-oauth"
